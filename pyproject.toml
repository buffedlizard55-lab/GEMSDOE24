[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gemsdoe24"
version = "0.2.0"
description = "Auditable spatial fault-detection experiments for DOE GEMS"
requires-python = ">=3.11"
dependencies = [
  "numpy==2.4.6", "scipy==1.17.1", "rasterio==1.4.4",
  "scikit-learn==1.9.1", "pyproj==3.7.2", "shapely==2.1.2",
  "pyshp==3.1.6", "threadpoolctl==3.7.0", "joblib==1.6.0"
]

[project.optional-dependencies]
dev = [
  "pandas==3.0.6", "requests==2.34.2", "pypdf==6.19.0",
  "beautifulsoup4==4.15.0", "pytest==9.1.1", "ruff==0.16.10"
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"

[tool.ruff]
target-version = "py311"
line-length = 100
# Frozen, source-hashed experiment runners are excluded; keep their receipt bytes/code immutable.
exclude = [
  "archive",
  "data",
  "data_external",
  ".venv",
  "logs",
  "scripts/build_unique_submission_gapfill.py",
  "scripts/build_unique_geothermal_submission.py",
]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
