name: Official inputs (roads and acquisition profiles)

# Runs the two official-source derivations that cannot run in the Arena sandbox
# (Census TIGER, USGS ScienceBase are unreachable there). Works on whatever
# Arena session branch triggers it, commits only small derived files back to
# THAT branch, and never writes to main or any other branch. Each job also
# commits the tail of its own log, because hosted-runner logs are not readable
# from the sandbox.
on:
  push:
    branches: ['arena/**']
    paths:
      - '.github/workflows/official-inputs-ci.yml'
      - 'scripts/fetch_official_roads.py'
      - 'scripts/extract_geodawn_profiles.py'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: official-inputs-${{ github.ref }}
  cancel-in-progress: false

jobs:
  roads:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install numpy==2.4.6 scipy==1.17.1 rasterio==1.4.4 pyshp==3.1.6 shapely==2.1.2 pyproj==3.7.2
      - name: Derive buffered Census road/vehicular-trail distances
        id: derive
        run: |
          set +e
          mkdir -p evidence/ci
          python scripts/fetch_official_roads.py 2>&1 | tee ci_roads.log
          code=${PIPESTATUS[0]}
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Commit outputs and log tail to this session branch only
        run: |
          set -euo pipefail
          case "$GITHUB_REF_NAME" in arena/*) ;; *) echo "refusing to write outside an arena/* branch"; exit 1;; esac
          mkdir -p evidence/ci
          { echo "exit_code=${{ steps.derive.outputs.exit_code }}"; tail -n 250 ci_roads.log; } > evidence/ci/roads.log
          git config user.name 'GEMS official-source audit'
          git config user.email 'gems-audit@users.noreply.github.com'
          git add evidence/ci/roads.log
          git add data/external/audit_sources/tiger_road_distance_m.tif data/external/audit_sources/tiger_road_receipt.json 2>/dev/null || true
          git commit -m "CI: official buffered roads result (exit ${{ steps.derive.outputs.exit_code }})" || exit 0
          for i in 1 2 3 4 5; do
            git pull --rebase origin "$GITHUB_REF_NAME" && git push origin "HEAD:$GITHUB_REF_NAME" && exit 0
            sleep $((i * 4))
          done
          exit 1

  profiles:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install numpy==2.4.6 pandas==3.0.6
      - name: Extract flight/line/date/position table from official profile CSVs
        id: derive
        run: |
          set +e
          mkdir -p evidence/ci
          python scripts/extract_geodawn_profiles.py 2>&1 | tee ci_profiles.log
          code=${PIPESTATUS[0]}
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Commit small outputs and log tail to this session branch only
        run: |
          set -euo pipefail
          case "$GITHUB_REF_NAME" in arena/*) ;; *) echo "refusing to write outside an arena/* branch"; exit 1;; esac
          mkdir -p evidence/ci
          { echo "exit_code=${{ steps.derive.outputs.exit_code }}"; tail -n 250 ci_profiles.log; } > evidence/ci/profiles.log
          git config user.name 'GEMS official-source audit'
          git config user.email 'gems-audit@users.noreply.github.com'
          git add evidence/ci/profiles.log
          git add data/external/audit_sources/geodawn_line_flight_summary.csv data/external/audit_sources/geodawn_fiducial_sample.csv.gz data/external/audit_sources/geodawn_profile_receipt.json 2>/dev/null || true
          git commit -m "CI: official GeoDAWN profile extraction (exit ${{ steps.derive.outputs.exit_code }})" || exit 0
          for i in 1 2 3 4 5; do
            git pull --rebase origin "$GITHUB_REF_NAME" && git push origin "HEAD:$GITHUB_REF_NAME" && exit 0
            sleep $((i * 4))
          done
          exit 1
