name: Official audit inputs
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pyshp pypdf
      - name: Fetch anonymous BLM claims and USGS acquisition metadata
        run: python scripts/fetch_official_audit_inputs.py --flight-paths --out data/raw/official_audit
      - name: Retain receipts including any failed requests
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: official-audit-inputs
          path: data/raw/official_audit/
          retention-days: 30
