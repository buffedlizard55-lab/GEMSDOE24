name: Official buffered roads
on:
  push:
    branches: ['arena/01a0fa76-gemsdoe24']
    paths:
      - '.github/workflows/buffered-roads.yml'
      - 'scripts/fetch_official_roads.py'
permissions:
  contents: write
jobs:
  roads:
    if: github.ref_name == 'arena/01a0fa76-gemsdoe24'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: arena/01a0fa76-gemsdoe24
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install numpy==2.4.6 scipy==1.17.1 rasterio==1.4.4 pyshp==3.1.6 shapely==2.1.2 pyproj==3.7.2
      - name: Derive true buffered road distances from complete official county ZIPs
        run: python scripts/fetch_official_roads.py
      - name: Preserve small official road raster on the fixed session branch
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = 'arena/01a0fa76-gemsdoe24'
          git config user.name 'GEMS official-source audit'
          git config user.email 'gems-audit@users.noreply.github.com'
          git pull --ff-only origin arena/01a0fa76-gemsdoe24
          git add data/external/audit_sources/tiger_road_distance_m.tif data/external/audit_sources/tiger_road_receipt.json
          if ! git diff --cached --quiet; then
            git commit -m 'Correct clipped-road boundary bias with official buffered Census geometry'
            git push origin arena/01a0fa76-gemsdoe24
          fi
