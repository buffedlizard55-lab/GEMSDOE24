name: Official buffered roads
on:
  workflow_dispatch:
  push:
    branches: ['arena/01a0fd2e-gemsdoe24']
    paths:
      - '.github/workflows/buffered-roads.yml'
      - 'scripts/fetch_official_roads.py'
permissions:
  contents: write
jobs:
  roads:
    if: github.ref_name == 'arena/01a0fd2e-gemsdoe24'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: arena/01a0fd2e-gemsdoe24
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install numpy==2.4.6 scipy==1.17.1 rasterio==1.4.4 pyshp==3.1.6 shapely==2.1.2 pyproj==3.7.2
      - name: Derive true buffered road distances from complete official county ZIPs
        run: |
          mkdir -p data/external/audit_sources
          set -o pipefail
          python -u scripts/fetch_official_roads.py 2>&1 | tee data/external/audit_sources/tiger_road_run.log
      - name: Upload small acquisition diagnostics (no raw county bulk)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: buffered-road-receipt-${{ github.run_id }}
          path: |
            data/external/audit_sources/tiger_road_*.json
            data/external/audit_sources/tiger_road_run.log
          if-no-files-found: warn
          retention-days: 14
      - name: Preserve small official road raster on the fixed session branch
        if: success()
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = 'arena/01a0fd2e-gemsdoe24'
          git config user.name 'GEMS official-source audit'
          git config user.email 'gems-audit@users.noreply.github.com'
          git pull --ff-only origin arena/01a0fd2e-gemsdoe24
          git add -A -- 'data/external/audit_sources/tiger_road_*'
          if ! git diff --cached --quiet; then
            git commit -m 'Add official buffered Census road/trail distance bridge'
            git push origin arena/01a0fd2e-gemsdoe24
          fi
      - name: Preserve bounded acquisition failure evidence for inspection
        if: failure()
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = 'arena/01a0fd2e-gemsdoe24'
          git config user.name 'GEMS official-source audit'
          git config user.email 'gems-audit@users.noreply.github.com'
          git pull --ff-only origin arena/01a0fd2e-gemsdoe24
          for f in \
            data/external/audit_sources/tiger_road_failure.json \
            data/external/audit_sources/tiger_road_fetch_failure.json \
            data/external/audit_sources/tiger_road_run.log; do
            if test -f "$f"; then git add "$f"; fi
          done
          if ! git diff --cached --quiet; then
            git commit -m 'Record bounded official road acquisition diagnostics'
            git push origin arena/01a0fd2e-gemsdoe24
          fi
