name: Reliability checks
on:
  push:
    branches: ['arena/**', main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      OPENBLAS_NUM_THREADS: 1
      OMP_NUM_THREADS: 1
      MKL_NUM_THREADS: 1
      NUMEXPR_NUM_THREADS: 1
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Verify the original preregistered source commit, not only a shallow merge.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: pip install -r requirements.txt
      - run: pip install --no-deps -e .
      - run: python scripts/evaluate_holdout.py --verify-recorded
      - run: python scripts/evaluate_holdout.py --verify-tnr1
      - run: python scripts/review_owner_sites.py --offline
      - run: python scripts/evaluate_holdout.py --verify-gvc1
      - run: python scripts/run_sahg1_lane.py --verify-recorded
      - run: python scripts/run_rshg1_lane.py --verify-recorded
      - run: python scripts/run_hcw_lane.py --verify-recorded
      - run: python scripts/run_dprf1_lane.py --verify-recorded
      - run: python scripts/run_dkrn1_lane.py --verify-recorded
      - run: python scripts/run_xvar1_lane.py --verify-recorded
      - run: python scripts/run_trsg1_lane.py --verify-recorded
      - run: python -m pytest -q
      - run: ruff check src scripts tests
      - run: ruff format --check src scripts tests
      - run: node --check docs/assets/app.js
      - run: node --check scripts/audit_tnr1_site.cjs
      - name: Browser review of staged site (never trains or visits external sites)
        run: |
          python scripts/build_site.py
          mkdir -p .site logs
          cp index.html executive-summary.html .site/
          cp -R docs .site/docs
          npm --prefix data/research/tnr1/browser-tools install --no-audit --no-fund playwright-core@1.64.1 @sparticuz/chromium@153.0.0 axe-core@4.14.0
          python -m http.server 8080 --bind 0.0.0.0 --directory .site > logs/browser-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID"' EXIT
          node scripts/audit_tnr1_site.cjs http://127.0.0.1:8080/
      - name: Preserve UI review receipt and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tnr1-browser-review
          path: |
            logs/tnr1-browser-audit.json
            logs/tnr1-desktop.png
            logs/tnr1-mobile.png
          if-no-files-found: ignore
          retention-days: 7
      - run: python scripts/refresh_source_feed.py --offline
      - run: python scripts/refresh_priority_feed.py --offline
